<style>
:root {
  color-scheme: light;
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F6F7F9; --ink: #111418; --muted: #5F6672; --line: #E3E6EB;
  --primary: #FAD724; --primary-ink: #111418; --ball: #FAD724; --accent-text: #111418;
  --good: #167A4A; --good-bg: #E3F5EA; --warn: #8A5A00; --warn-bg: #FFF1D6; --bad: #B3261E; --bad-bg: #FDE7E5;
  --info-bg: #FFF6C7; --muted-bg: #EEF0F3;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #111418; outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; }

/* top bar */
.top {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-right: auto; }
.brand .logo { height: 40px; width: auto; display: block; }
.brand-name { font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); line-height: 1; }
.auth-logo { display: block; margin: 0 auto 6px; height: 54px; width: auto; max-width: 100%; }
.foot-logo { height: 30px; width: auto; display: block; margin-bottom: 4px; }
.auth-sub { text-align: center; }
.ball {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: linear-gradient(var(--ball) 0 44%, var(--ink) 44% 56%, var(--surface) 56%);
  border: 2px solid var(--ink); position: relative;
}
.ball::after {
  content: ""; position: absolute; inset: 50% auto auto 50%; width: 9px; height: 9px;
  transform: translate(-50%, -50%); border-radius: 50%; background: var(--surface); border: 2px solid var(--ink);
}
.brand h1 { font-size: 22px; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: 12.5px; background: var(--muted-bg); color: var(--muted);
}
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.live { background: var(--good-bg); color: var(--good); }
.pill.live i { background: var(--good); }
.pill.local { background: var(--warn-bg); color: var(--warn); }
.pill.local i { background: var(--warn); }

.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px;
  cursor: pointer; font-weight: 500; transition: background .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 700; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--primary); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* layout */
.layout { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 20px; padding: 20px; max-width: 1180px; margin: 0 auto; align-items: start; }
.listpane { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px; max-height: calc(100vh - 90px); }
.search {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px;
  cursor: pointer; font-size: 13px; color: var(--muted);
}
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.items { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 2px; }
.item {
  text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 11px 13px; cursor: pointer; display: grid; gap: 4px;
}
.item:hover { border-color: var(--muted); }
.item[aria-current="true"] { border-color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); }
.item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item .code { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.item .pair { font-weight: 500; overflow-wrap: anywhere; }
.item .meta { color: var(--muted); font-size: 12.5px; }
.empty { color: var(--muted); padding: 24px 12px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.tone-good { background: var(--good-bg); color: var(--good); }
.tone-warn { background: var(--warn-bg); color: var(--warn); }
.tone-bad { background: var(--bad-bg); color: var(--bad); }
.tone-info { background: var(--info-bg); color: #111418; }
.tone-muted { background: var(--muted-bg); color: var(--muted); }

/* ticket slip */
.slip {
  background: var(--surface); border: 1px solid var(--line); border-top: 7px solid var(--ball);
  border-radius: 14px; overflow: hidden;
}
.slip-head { padding: 18px 22px 16px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.slip-head .id { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .03em; margin-right: auto; }
.slip-head .sub { color: var(--muted); font-size: 13px; width: 100%; margin-top: -6px; }
.perf { position: relative; height: 0; border-top: 2px dashed var(--line); margin: 0 14px; }
.perf::before, .perf::after {
  content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line);
}
.perf::before { left: -25px; } .perf::after { right: -25px; }
.slip-body { padding: 20px 22px 22px; display: grid; gap: 18px; }

.guard {
  display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 10px;
  background: var(--info-bg); font-size: 14px;
}
.guard.bad { background: var(--bad-bg); }
.guard strong { font-weight: 700; }

.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: stretch; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; margin: 0; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.trk { display: flex; gap: 8px; margin: 6px 0 0 34px; }
.trk input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.steps { display: grid; gap: 4px; }
.side { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface-2); display: grid; gap: 10px; align-content: start; }
.side h3 { font-size: 18px; overflow-wrap: anywhere; }
.side .lbl { color: var(--muted); font-size: 13px; }
.side ul { margin: 0; padding-left: 18px; }
.side li { overflow-wrap: anywhere; }

.check {
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px;
}
.check:hover:not(:disabled) { border-color: var(--muted); }
.check:disabled { cursor: not-allowed; opacity: .55; }
.check .box {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); flex: none;
  display: grid; place-items: center; font-size: 14px; font-weight: 700; color: transparent;
}
.check[aria-pressed="true"] { background: var(--good-bg); border-color: var(--good); }
.check[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); color: #fff; }
.check .t { font-weight: 500; }
.check .s { color: var(--muted); font-size: 12.5px; display: block; }

.section-title { font-size: 14px; color: var(--muted); font-weight: 700; margin-bottom: 8px; font-family: var(--body); }
.stack { display: grid; gap: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.notes { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.log li { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.log li:first-child { border-top: 0; }
.log time { color: var(--muted); }
.log b { font-weight: 500; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.back { display: none; margin-bottom: 10px; }

.detail-empty { padding: 60px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
dialog::backdrop { background: rgba(10, 14, 22, .55); }
.dlg { padding: 20px 22px 22px; display: grid; gap: 14px; }
.dlg h2 { font-size: 22px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 500; font-size: 14px; }
.field small { color: var(--muted); }
.field input, .field textarea, .field select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2);
}
.field textarea { min-height: 84px; resize: vertical; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.disclaimer { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; }
.disclaimer h3 { font-size: 15px; margin: 0; }
.disclaimer ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink); }
.agree { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.agree input { width: 20px; height: 20px; margin-top: 1px; flex: none; accent-color: var(--primary); }
.proofs { display: grid; gap: 10px; }
.proofrow { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--surface); }
.proofrow img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; flex: none; }
.proofrow .pdf { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; color: var(--accent-text); flex: none; text-decoration: none; }
.proofrow small { color: var(--muted); display: block; }
.proofup { display: grid; gap: 8px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; }
.proofup input[type=file] { max-width: 100%; }

.cardrow { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; background: var(--surface-2); }
.cardrow .top { display: flex; gap: 8px; align-items: center; }
.cardrow .top input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pslot { position: relative; border: 1.5px dashed var(--line); border-radius: 10px; min-height: 120px; display: grid; place-items: center; text-align: center; overflow: hidden; background: var(--surface); color: var(--muted); font-size: 13px; padding: 8px; }
.pslot b { display: block; color: var(--ink); font-size: 14px; }
.pslot.has { border-style: solid; border-color: var(--good); padding: 0; }
.pslot img { width: 100%; height: 140px; object-fit: cover; display: block; }
.pslot input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.pslot .tag { position: absolute; left: 6px; bottom: 6px; background: rgba(255,255,255,.92); color: var(--ink); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
.galrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.galrow figure { margin: 0; display: grid; gap: 4px; }
.galrow img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: zoom-in; display: block; }
.galrow figcaption { font-size: 13px; color: var(--muted); }
.galtitle { font-weight: 600; margin: 0 0 6px; }
.zoom { padding: 14px; display: grid; gap: 10px; justify-items: center; }
.zoom img { max-width: 100%; max-height: 78vh; border-radius: 10px; }
@media (max-width: 560px) { .photos, .galrow { gap: 8px; } .pslot img { height: 110px; } }

.err { color: var(--bad); font-size: 13.5px; min-height: 1em; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.mmlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mmlist li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }

#toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  max-width: calc(100vw - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
}
#toast.show { opacity: 1; }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; padding: 14px; }
  .listpane { position: static; max-height: none; }
  #app[data-view="list"] #detail { display: none; }
  #app[data-view="detail"] .listpane { display: none; }
  .back { display: inline-block; }
  .sides { grid-template-columns: 1fr; }
  .cols, .two { grid-template-columns: 1fr; }
  .slip-head .id { font-size: 26px; }
  .log li { grid-template-columns: 1fr; gap: 0; }
}

[hidden] { display: none !important; }
.tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); overflow-x: auto; }
.tab {
  border: 0; background: none; padding: 11px 14px; cursor: pointer; color: var(--muted); font-weight: 500;
  border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ball); font-weight: 700; }
.page { max-width: 820px; margin: 0 auto; padding: 24px 20px 48px; display: grid; gap: 18px; }
.page h2 { font-size: 30px; letter-spacing: -0.01em; }
.page .lead { margin: 0; color: var(--muted); font-size: 16px; max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 12px; }
.card h3 { font-size: 19px; }
.card p { margin: 0; }
.proc { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: step; }
.proc li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 16px 62px; position: relative; display: grid; gap: 8px; }
.proc li::before {
  counter-increment: step; content: counter(step); position: absolute; left: 16px; top: 14px; width: 32px; height: 32px;
  border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--display); font-weight: 700;
}
.proc h3 { font-size: 18px; }
.who { display: grid; grid-template-columns: 96px 1fr; gap: 3px 10px; margin: 0; font-size: 14.5px; }
.who dt { color: var(--muted); }
.who dd { margin: 0; }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.flags { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.mrow { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.mrow .l { display: grid; gap: 3px; min-width: 0; }
.mrow .nm { font-weight: 700; overflow-wrap: anywhere; }
.mrow .sm { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.mlist { display: grid; gap: 8px; }
.kv .chip { margin-left: 6px; }
.guard.warn { background: var(--warn-bg); }
.claim { display: flex; gap: 8px; flex-wrap: wrap; }
.claim input { flex: 1; min-width: 160px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.notice { background: var(--warn-bg); color: var(--ink); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
@media (max-width: 820px) {
  .page { padding: 18px 14px 40px; }
  .page h2 { font-size: 26px; }
  .who { grid-template-columns: 1fr; }
  .mrow { flex-direction: column; align-items: stretch; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- additions for the Supabase version ---- */
.who-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.who-chip strong { color: var(--ink); font-weight: 700; }
.auth { max-width: 460px; margin: 28px auto; }
.auth .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--muted-bg); padding: 4px; border-radius: 12px; }
.auth .seg button { border: 0; background: transparent; padding: 9px; border-radius: 9px; cursor: pointer; font-weight: 500; color: var(--muted); }
.auth .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.auth form { display: grid; gap: 12px; }
.auth .fine { color: var(--muted); font-size: 13px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-text); cursor: pointer; text-decoration: underline; font-size: 13.5px; }
.check-line { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check-line input { margin-top: 4px; }
.field input[type="file"] { padding: 7px; }
select.field-select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.setup { max-width: 640px; margin: 40px auto; padding: 0 20px; }

/* ---- polish ---- */
.mark { width: 32px; height: 32px; flex: none; }
.av { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; margin-right: 8px;
  font: 700 11px var(--body); vertical-align: middle; background: hsl(var(--h) 60% 88%); color: hsl(var(--h) 50% 26%); }
.seg6 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.seg6 i { height: 6px; border-radius: 3px; background: var(--line); }
.seg6 i.on { background: var(--good); }
.seg6 i.cur { background: var(--warn); }
.next { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 14px 16px;
  border-radius: 12px; border: 2px solid var(--primary); background: var(--info-bg); }
.next.wait { border-color: var(--line); background: var(--surface-2); }
.next small { display: block; color: var(--muted); font-size: 12.5px; }
.next b { display: block; font: 700 17px var(--display); }
.item { transition: box-shadow .15s, border-color .15s; }
.item:hover { box-shadow: 0 3px 10px rgba(20, 30, 50, .09); }
.slip, .card { box-shadow: 0 2px 14px rgba(20, 30, 50, .05); }
.btn { transition: background .12s, border-color .12s, transform .06s; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.top { position: sticky; top: 0; z-index: 20; }
.demo-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 20px; background: var(--info-bg); color: #111418; font-size: 13.5px; }
.demo-bar select { padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* ---- dark, bold look ---- */
body { background: radial-gradient(1100px 420px at 50% -180px, #FFF6C7 0%, var(--bg) 62%) no-repeat, var(--bg); }
h1, h2, h3 { letter-spacing: -0.02em; }
.page h2 { font-size: 40px; font-weight: 700; line-height: 1.05; }
.brand h1 { font-size: 25px; font-weight: 700; }
.top { background: rgba(255, 255, 255, .88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.tabs { background: var(--bg); padding: 4px 16px; gap: 6px; }
.tab { border-radius: 999px; margin: 6px 0; padding: 8px 16px; border-bottom: 0; }
.tab[aria-selected="true"] { background: var(--primary); color: var(--primary-ink); font-weight: 700; }
.btn { border-radius: 999px; background: var(--surface); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); padding: 9px 18px; }
.btn.primary:hover:not(:disabled) { background: #E6C200; filter: none; }
.item, .card, .side, .mrow { border-radius: 16px; }
.item:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(17, 20, 24, .12); }
.item[aria-current="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.fchip[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); font-weight: 700; }
.slip { border: 1px solid var(--line); border-radius: 18px; }
.slip::before { content: ""; display: block; height: 6px; background: linear-gradient(90deg, #111418, var(--primary)); }
.slip-head .id { font-size: 36px; font-weight: 700; }
.perf::before, .perf::after { background: var(--bg); }
.next { background: #FFFBE6; }
.tone-info { background: var(--info-bg); color: #111418; }
.tone-warn { color: var(--warn); }
.search, .field input, .field textarea, .field select { border-radius: 12px; }
dialog { border-radius: 20px; }
.empty, .detail-empty { border-radius: 16px; }
.seg6 i { background: var(--line); }
#toast { background: var(--primary); color: var(--primary-ink); font-weight: 700; }

/* ---- website layout ---- */
.top { padding: 12px 24px; gap: 18px; }
.top .tabs { flex: 1; justify-content: center; background: none; border: 0; padding: 0; gap: 2px; overflow: visible; }
.top .tab { margin: 0; padding: 8px 14px; font-size: 14.5px; }
.top .tab[aria-selected="true"] { background: #FFF6C7; color: var(--accent-text); }
.top .brand { margin-right: 0; }
.home { overflow: hidden; }
.hero { max-width: 1100px; margin: 0 auto; padding: 72px 24px 56px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; }
.eyebrow { display: inline-block; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); font-weight: 700; margin-bottom: 14px; }
.hero h2 { font-size: clamp(42px, 7vw, 78px); line-height: .98; font-weight: 700; letter-spacing: -.035em; }
.hero .sub { font-size: 18px; color: var(--muted); max-width: 48ch; margin: 18px 0 26px; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
.btn.big { padding: 13px 26px; font-size: 16px; }
.alert-pill { margin-top: 18px; border: 1px solid var(--primary); background: #FFF6C7; color: var(--accent-text); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 700; }
.hero-art { position: relative; height: 340px; }
.pcard { position: absolute; width: 210px; height: 290px; border-radius: 18px; border: 1px solid var(--line); top: 20px; }
.c3 { left: 4%; transform: rotate(-12deg); background: linear-gradient(160deg, #FFEC8A, #FFFBE6); border-color: #F3D85A; }
.c2 { left: 24%; transform: rotate(-3deg); background: linear-gradient(160deg, #111418, #3A3F47); border: 0; }
.c1 { left: 44%; transform: rotate(8deg); background: #fff; color: #111418; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; box-shadow: 0 20px 44px rgba(17,20,24,.18); }
.c1 b { font: 700 22px var(--display); } .c1 small { color: #555; font-size: 14px; }
.pill-ok { align-self: flex-start; background: var(--good-bg); color: var(--good); padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: auto; }
.sec { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
.sec > h2 { font-size: clamp(28px, 4vw, 40px); margin-bottom: 22px; }
.steps5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.st, .feat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 6px; align-content: start; }
.st .n { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font: 700 16px var(--display); }
.st h3, .feat h3 { font-size: 17px; } .st p, .feat p { margin: 0; color: var(--muted); font-size: 14.5px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.feat .ic { font-size: 24px; }
.band { background: #111418; color: #fff; border-radius: 24px; padding: 44px 32px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.band h2 { font-size: clamp(28px, 4vw, 42px); } .band p { margin: 0 0 8px; font-size: 17px; }
.band .btn.primary { background: #FAD724; color: #111418; border-color: #FAD724; }
.band .btn.primary:hover:not(:disabled) { background: #FFE866; }
.foot { border-top: 1px solid var(--line); margin-top: 40px; padding: 28px 24px 40px; }
.foot-in { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px 32px; }
.foot p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.foot-links { display: flex; gap: 18px; justify-content: flex-end; align-items: flex-start; flex-wrap: wrap; }
.foot .fine { grid-column: 1 / -1; font-size: 13px; }
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; padding-top: 40px; } .hero-art { height: 300px; max-width: 420px; }
  .steps5 { grid-template-columns: 1fr 1fr; } .grid4 { grid-template-columns: 1fr 1fr; }
  .top .tabs { order: 3; width: 100%; flex: none; justify-content: flex-start; overflow-x: auto; }
  .foot-in { grid-template-columns: 1fr; } .foot-links { justify-content: flex-start; }
}
@media (max-width: 560px) { .steps5, .grid4 { grid-template-columns: 1fr; } .top { padding: 10px 14px; } }

/* ---- illustrations / image slots ---- */
.art svg, .art img { width: 100%; height: auto; display: block; }
.art img { border-radius: 22px; object-fit: cover; }
.hero-art { height: auto; max-width: 480px; justify-self: center; width: 100%; }
.st-art { width: 52px; }
.band { position: relative; overflow: hidden; }
.band-art { position: absolute; right: 22px; bottom: -6px; width: 170px; }
.auth-art { width: 92px; margin: 0 auto -4px; }
.empty-art { width: 84px; margin: 0 auto 10px; }
@media (max-width: 900px) { .band-art { display: none; } }

/* ---- no layout shift when switching tabs ---- */
html { overflow-y: scroll; scrollbar-gutter: stable; }
.tab, .tab:hover, .tab[aria-selected="true"], .top .tab[aria-selected="true"] { font-weight: 600; }
.top .tabs { min-height: 40px; }
.top .tab { white-space: nowrap; }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.shop-tile { display: grid; gap: 6px; align-content: start; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--primary); border-radius: 14px; color: var(--ink); text-decoration: none; }
.shop-tile:hover { box-shadow: 0 6px 20px rgba(17, 20, 24, .12); border-color: var(--ink); }
.shop-tile strong { font-size: 17px; }
.shop-tile span { color: var(--muted); font-size: 14px; }
.shop-tile em { font-style: normal; font-weight: 700; font-size: 14px; margin-top: 4px; }
.pol-list { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.card a.btn { text-decoration: none; justify-self: start; display: inline-block; }
.fine-p { color: var(--muted); font-size: 13px; }
</style>
</head>

const $ = (s, r) => (r || document).querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "disabled" || k === "hidden" || k === "readOnly") el[k] = true;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

async function loadEvents() {
  if (!S.selected) { S.events = []; S.contacts = []; S.photos = []; S.proofs = []; return; }
  const [ev, ct, ph, pr] = await Promise.all([
    sb.from("ticket_events").select("id, actor_id, text, created_at").eq("ticket_id", S.selected).order("id", { ascending: false }),
    sb.rpc("ticket_contacts", { p_id: S.selected }),
    sb.from("ticket_photos").select("card_no, side, path").eq("ticket_id", S.selected).order("card_no"),
    sb.from("ticket_proofs").select("id, uploaded_by, path, created_at").eq("ticket_id", S.selected).order("id")
  ]);
  S.events = ev.data || [];
  S.contacts = ct.data || [];
  S.photos = ph.data || [];
  S.proofs = pr.data || [];
  if (S.proofs.length) {
    try {
      const { data } = await sb.storage.from("payment-proofs").createSignedUrls(S.proofs.map((p) => p.path), 3600);
      S.proofs.forEach((p) => { const m = (data || []).find((x) => x.path === p.path); p.url = m && m.signedUrl; });
    } catch (e) { /* proofs show without a preview */ }
  }
  if (S.photos.length) {
    try {
      const { data } = await sb.storage.from(PHOTO_BUCKET).createSignedUrls(S.photos.map((p) => p.path), 3600);
      S.photos.forEach((p) => { const m = (data || []).find((x) => x.path === p.path); p.url = m && m.signedUrl; });
    } catch (e) { /* photos show as unavailable */ }

}

let channel = null;
function subscribeRealtime() {

  channel = sb.channel("trade-desk");
  for (const table of ["tickets", "ticket_events", "profiles", "vouches"]) {
    channel.on("postgres_changes", { event: "*", schema: "public", table }, scheduleRefresh);

async function rpc(name, args, okMsg) {

/* ------------------------------------------------------------------ ticket logic */
const STEPS = [
  { key: "buyer_accept", col: "buyer_accepted_at", actor: "buyer" },
  { key: "accept", col: "accepted_at", actor: "middleman" },
  { key: "received", col: "received_at", actor: "middleman" },
  { key: "inspected", col: "inspected_at", actor: "middleman" },
  { key: "paid", col: "paid_at", actor: "seller" },
  { key: "shipped", col: "shipped_at", actor: "middleman" },
  { key: "delivered", col: "delivered_at", actor: "buyer" }
];
function stage(t) {
  if (t.flag === "cancelled") return { key: "cancelled", label: "Cancelled", tone: "muted" };
  if (t.flag === "disputed") return { key: "disputed", label: "Disputed", tone: "bad" };
  if (t.flag === "failed") return { key: "failed", label: "Failed inspection", tone: "bad" };
  if (t.delivered_at) return { key: "done", label: "Completed", tone: "good" };
  if (t.shipped_at) return { key: "shipped", label: "Shipped to buyer", tone: "info" };
  if (t.paid_at) return { key: "paid", label: "Paid · ship to buyer", tone: "warn" };
  if (t.inspected_at) return { key: "verified", label: "Verified · buyer can pay", tone: "good" };
  if (t.received_at) return { key: "inspect", label: "Card received · inspect", tone: "warn" };
  if (t.accepted_at) return { key: "waiting", label: "Waiting for seller to ship", tone: "warn" };
  if (!t.buyer_accepted_at) return { key: "buyer", label: "Waiting for buyer to accept", tone: "warn" };
  return { key: "accept", label: "Waiting for middleman to accept", tone: "warn" };
}
const VERBS = ["accept this ticket as the buyer", "accept the ticket", "mark the card received", "inspect the card", "confirm payment", "ship the card", "confirm receipt"];
function nextIdx(t) { return t.flag ? -1 : STEPS.findIndex((s) => !t[s.col]); }
function yourTurn(t) { const i = nextIdx(t); return i >= 0 && !!roles(t)[STEPS[i].actor]; }
function bar(t) { const n = STEPS.filter((s) => t[s.col]).length; return h("div", { class: "seg6", role: "img", "aria-label": n + " of 7 steps done" }, STEPS.map((s, i) => h("i", { class: i < n ? "on" : i === n && !t.flag ? "cur" : "" }))); }
function nextAction(t) {
  const i = nextIdx(t); if (i < 0) return null;
  const s = STEPS[i];
  if (s.key === "paid" && !S.proofs.length) return h("div", { class: "next wait" }, h("div", null, h("small", null, "Next step"), h("b", null, "Waiting for " + buyerName(t) + " to upload proof of payment")));
  if (roles(t)[s.actor]) return h("div", { class: "next" }, h("div", null, h("small", null, "Your turn"), h("b", null, VERBS[i][0].toUpperCase() + VERBS[i].slice(1))),
    h("button", { class: "btn primary", type: "button", onclick: () => rpc("advance_ticket", { p_id: t.id, p_step: s.key }) }, "Do it now"));
  return h("div", { class: "next wait" }, h("div", null, h("small", null, "Next step"), h("b", null, "Waiting for " + actorName(t, s.actor) + " to " + VERBS[i])));
}
function roles(t) {
  const id = S.me && S.me.id;
  return { seller: t.seller_id === id, buyer: t.buyer_id === id, middleman: t.middleman_id === id, admin: isAdmin() };
}

const PHOTO_BUCKET = "card-photos", MAX_PHOTO = 5 * 1024 * 1024;
async function preparePhoto(file) {
  if (!file || !/^image\//.test(file.type || "")) throw new Error("Choose an image file (a photo of the card).");
  try {
    if (typeof createImageBitmap === "function") {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);

      if (blob) return blob;
    }
  } catch (e) { /* fall through to the original file */ }
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("Use a JPG, PNG or WebP photo.");
  if (file.size > MAX_PHOTO) throw new Error("That photo is too big. Use one under 5 MB.");
  return file;
}

      me.verified_at ? h("span", { class: "chip tone-good" }, "✓ Verified") : h("span", { class: "chip tone-warn" }, "Waiting for an admin to verify you")) : null,
    me && !me.verified_at ? h("p", { style: "color:var(--muted)" }, "The admin will check your identity with you directly, for example on a video call. Once verified you can vouch for other members.") : null,
    me && me.verified_at ? h("p", { style: "color:var(--muted)" }, "You can vouch for people you've personally traded with.") : null].filter(Boolean));
  const ci = $("#m-cell");
  if (ci && !ci.value && document.activeElement !== ci) ci.value = S.myCell || "";
  $("#m-cell-msg").textContent = S.myCell ? "Shared with the seller, buyer and middleman on tickets you are part of, and with admins." : "Add your cell number. You need one before you can open a ticket or be named on one.";

  const list = S.members.filter((m) => !q || norm(m.name).includes(q))
    .sort((a, b) => (!!b.verified_at - !!a.verified_at) || (Number(b.vouch_count) - Number(a.vouch_count)) || a.name.localeCompare(b.name));

/* ------------------------------------------------------------------ admin view */
const AD = {};
let adminBuilt = false;
function buildAdmin() {
  adminBuilt = true;
  AD.note = h("input", { id: "ad-note", maxlength: "120", placeholder: "e.g. Video call, matched Discord", autocomplete: "off" });
  AD.pending = h("div", { class: "mlist" });

  $("#view-admin").append(
    h("h2", null, "Admin"),
    h("p", { class: "lead" }, "Verify members and give out roles."),
    h("div", { class: "card" },
      h("h3", null, "Verify members"),
      h("p", { style: "color:var(--muted);font-size:14px" }, "Verify someone only after you've checked who they are outside this tool. Write down how, so other admins can see it."),
      h("div", { class: "field" }, h("label", { for: "ad-note" }, "How did you verify them?"), AD.note),

}
function renderAdmin() {
  if (!isAdmin()) return;
  if (!adminBuilt) buildAdmin();
  const memberRowAdmin = (m, verifiedList) => {
    const p = S.privates[m.id] || {};
    return h("div", { class: "mrow" },
      h("div", { class: "l" },
        h("span", { class: "nm" }, m.name),
        h("span", { class: "sm" }, "Cell: " + (p.cell || "none") + ". Joined " + when(m.created_at) + (m.verified_at ? ". Verified " + when(m.verified_at) + (p.verify_note ? ". Method: " + p.verify_note : "") : "")),),
      h("div", { class: "actions" },
        !verifiedList && h("button", { class: "btn small primary", type: "button", onclick: () => {
          const note = AD.note.value.trim();
          if (note.length < 3) { toast("Write how you verified them first."); return; }
          rpc("verify_member", { p_user: m.id, p_note: note }, m.name + " verified.");
        } }, "Verify"),
        verifiedList && h("button", { class: "btn small danger", type: "button", onclick: () => rpc("revoke_verification", { p_user: m.id }, "Verification removed.") }, "Revoke"),
        verifiedList && (() => {
          const sel = h("select", { class: "field-select", "aria-label": "Role for " + m.name, disabled: m.id === S.me.id },
            ["member", "middleman", "admin"].map((r) => h("option", { value: r }, r)));
          sel.value = m.role;
          sel.addEventListener("change", () => rpc("set_role", { p_user: m.id, p_role: sel.value }, "Role updated."));
          return sel;
        })()));
  };
  const pending = S.members.filter((m) => !m.verified_at);
  const verified = S.members.filter((m) => m.verified_at);
  AD.pending.replaceChildren(
    h("div", { class: "section-title" }, "Waiting for verification (" + pending.length + ")"),
    ...(pending.length ? pending.map((m) => memberRowAdmin(m, false)) : [h("div", { class: "empty" }, "Nobody is waiting.")]));
  AD.verified.replaceChildren(
    h("div", { class: "section-title" }, "Verified members (" + verified.length + ")"),
    ...verified.map((m) => memberRowAdmin(m, true)));
}

/* ------------------------------------------------------------------ how it works */
function buildHow() {
  const step = (title, body, who) => h("li", null, h("h3", null, title), h("p", null, body),
    h("dl", { class: "who" }, who.map(([k, v]) => [h("dt", null, k), h("dd", null, v)])));
  $("#view-how").append(
    h("h2", null, "How a trade works"),
    h("p", { class: "lead" }, "Every sale goes through a middleman. The card goes to the middleman first, and the buyer pays only after the card has been checked. Read this before your first trade."),
    h("ol", { class: "proc" },
      step("Seller opens a ticket", "The seller creates the ticket and types in the buyer's full name, cell number and email, plus the card(s) with a photo of the front and the back of each one, the agreed price and the payment method, and picks a middleman. The buyer then has to log in to Trade Desk and accept the ticket first. Each person sees on the ticket whose turn it is, and everyone on the ticket sees the seller's and buyer's full name, cell number and email.",
        [["Seller", "Creates the ticket. Does not ship yet."], ["Buyer", "Signs up on Trade Desk with the email the seller typed (if not a member yet), checks the card, price and payment method, and accepts the ticket in the tool."], ["Middleman", "Can accept once the buyer has accepted in the tool. Checks that both people are verified, and accepts too."]]),
      step("Seller ships the card to the middleman", "Once the middleman has accepted the ticket, the seller sends the card only to the middleman named on it, and shares the tracking number. The seller pays the shipping to the middleman.",
        [["Seller", "Ships to the middleman and pays that shipping. Never to the buyer."], ["Buyer", "Waits. Does not pay yet."], ["Middleman", "Marks the card as received when it arrives."]]),
      step("Middleman inspects the card", "The middleman checks that the card matches the listing and the front and back photos on the ticket. If it doesn't, the ticket is flagged and the card goes back to the seller.",
        [["Middleman", "Marks the card as inspected, or flags it as failed."], ["Everyone", "The ticket status changes to “Verified · buyer can pay”."]]),
      step("Buyer pays the seller", "Only once the ticket says Verified does the buyer pay the seller, using the agreed price and method. The buyer must also upload the required proof of payment on the ticket: an original, Bank Stamped and Dated Proof of Payment.",
        [["Buyer", "Pays the seller and uploads the required proof of payment on the ticket (original, Bank Stamped and Dated)."], ["Seller", "Confirms on the ticket once the money has arrived. This is only possible after the proof of payment is uploaded."]]),
      step("Middleman ships to the buyer", "After the seller confirms payment, the middleman ships the card to the buyer and adds the tracking number. The buyer pays the shipping from the middleman to them.",
        [["Middleman", "Ships and records tracking."], ["Buyer", "Pays the shipping to them and confirms receipt. The ticket then shows Completed."]])),
    h("div", { class: "card" }, disclaimerBox()),
    h("div", { class: "card" }, h("h3", null, "Rules for everyone"),
      h("ul", { class: "rules" },
        h("li", null, "No ticket, no trade. If it isn't on a ticket, it isn't protected. Sellers open the ticket."),
        h("li", null, "Cards go only to an approved middleman, and only after they have accepted the ticket. Never send a card directly to the other person."),
        h("li", null, "Buyers pay only after the ticket shows Verified, and upload the required proof of payment: original, Bank Stamped and Dated."),
        h("li", null, "Shipping: the seller pays to ship the card to the middleman. The buyer pays for the middleman to ship it on to them."),
        h("li", null, "Pay and ship only to the people named on the ticket."),
        h("li", null, "Keep screenshots and tracking numbers until the ticket is Completed."),
        h("li", null, "If something feels wrong, stop and flag a dispute. Don't carry on in DMs."))),
    h("div", { class: "card" }, h("h3", null, "Red flags"),
      h("ul", { class: "flags" },
        h("li", null, "Someone pushes you to skip the middleman or to hurry."),
        h("li", null, "A “middleman” who isn't shown as Middleman in the member list, or who messages you first."),
        h("li", null, "Someone asks for payment to a different name or account than the one agreed on the ticket."),
        h("li", null, "A seller who asks you to pay before the card is verified."),
        h("li", null, "A new or unverified member with no vouches offering a very good deal."))),
    h("div", { class: "card" }, h("h3", null, "Verified members and vouches"),
      h("p", null, "Create an account with your full name, email, cell number and a password. Your full name is your username and other members can see it. The admin then verifies you directly, for example on a video call. Verified members can vouch for people they have personally traded with."),
      h("p", null, "A vouch is a personal recommendation, not a guarantee. Check someone's profile before trading, and still follow every step above."),
      h("p", null, "Never share your password or a photo of your ID in the group chat. Nobody from Trade Desk will ever ask for them.")));
}


/* ------------------------------------------------------------------ policy */
function buildPolicy() {
  const sec = (title, items, ordered) => h("div", { class: "card" }, h("h3", null, title),
    h(ordered ? "ol" : "ul", { class: ordered ? "" : "flags" }, items.map((t) => h("li", null, t))));
  $("#view-policy").append(
    h("h2", null, "Trade Desk policy"),
    h("p", { class: "lead" }, "The rules every member agrees to when they create an account. Version " + TERMS_VERSION + "."),
    h("div", { class: "card" }, h("h3", null, "Disclaimer"), h("ol", { class: "pol-list" }, DISCLAIMER.map((t) => h("li", null, t)))),
    sec("The middleman process", [
      "Every trade goes through the middleman. Never send a card or money directly to the other person.",
      "The seller opens a ticket with the buyer's full name, cell number and email, and a front and back photo of every card.",
      "The buyer accepts the ticket in Trade Desk first, then the middleman accepts it.",
      "The seller ships the card to the middleman. The middleman confirms it arrived and inspects it.",
      "Only after the card is inspected does the buyer pay the seller. The buyer uploads the " + PROOF_TEXT + " on the ticket.",
      "The seller confirms payment, then the middleman ships the card to the buyer. The buyer confirms delivery and the ticket is closed."], true),
    sec("Shipping costs", [
      "The seller pays for shipping to the middleman.",
      "The buyer pays for shipping from the middleman to the buyer.",
      "Always send tracked. Add the tracking number on the ticket."]),
    sec("Proof of payment and disputes", [
      "The buyer must upload an " + PROOF_TEXT + ". The seller can only confirm payment after it is uploaded.",
      "If the seller says the money has not arrived, the card stays with the middleman until it is resolved. This may involve statements from the sending and receiving accounts.",
      "Disputes that cannot be resolved this way are for the buyer and seller to sort out with their own banks and to post updates on the ticket."]),
    sec("Your responsibilities", [
      "Give your real full name, cell number and email. Your full name is your username and other members can see it.",
      "Describe cards honestly and photograph the front and back clearly.",
      "Keep the conversation about a trade on its ticket. Flag a dispute instead of carrying on in private messages.",
      "Never share your password. Nobody from Trade Desk will ask for it or for a photo of your ID."]),
    sec("Your information", [
      "The seller, buyer and middleman on a ticket can see each other's name, cell number and email, so the trade can be completed.",
      "Photos and proof of payment are stored privately and shown only to the people on that ticket and the admin.",
      "Trade Desk is community-run and not affiliated with any card publisher."]),
    sec("Admin rights", [
      "The middleman can step in on any ticket. The admin decides who is verified and can refuse members who break these rules.",
      "These rules may change. When they do, members may be asked to agree again."]));
}

/* ------------------------------------------------------------------ main render */
function render() {
  renderShell();
  renderHome();
  renderAuth();
  renderChips();
  renderList();
  renderDetail();
  renderMembers();
  renderAdmin();
}

/* ------------------------------------------------------------------ wiring */
$("#btn-new").addEventListener("click", openTicketForm);
$("#btn-out").addEventListener("click", async () => { await sb.auth.signOut(); });
$("#search").addEventListener("input", (e) => { S.q = e.target.value; renderList(); });

buildHow();
buildPolicy();
buildShop();
buildMembers();
render();

sb.auth.onAuthStateChange((event, session) => {
  // Don't call Supabase inside this callback directly. Defer it.
  setTimeout(async () => {
    S.session = session;
    if (event === "PASSWORD_RECOVERY") S.recovery = true;
    if (event === "SIGNED_OUT") { S.selected = null; S.tab = "home"; }
    await refreshAll();
    subscribeRealtime();
    render();
  }, 0);
});
